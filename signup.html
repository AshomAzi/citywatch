<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create an Account - CityWatch</title>
    <link rel="stylesheet" href="style/signup.css">
    <link rel="stylesheet" href="style/styles.css">
    <link rel="shortcut icon" href="images/favicon.ico" type="image/x-icon">
</head>

<body>

    <header class="site-header">
        <div class="container header-content">
            <a href="index.html" class="brand-logo">
                <div class="brand-icon">
                    <svg style="width: 1.25rem; height: 1.25rem;" fill="none" stroke="currentColor" stroke-width="2"
                        viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
                    </svg>
                </div>
                <span>CityWatch</span>
            </a>

            <div class="header-actions">
                <nav class="nav-links">
                    <a href="index.html" class="nav-link">Issues</a>
                    <a href="signin.html" class="nav-link">Log In</a>
                </nav>

                <button id="themeToggleBtn" class="theme-toggle-btn" aria-label="Toggle light/dark theme"
                    title="Toggle theme">
                    <svg id="sunIcon" style="width: 1.25rem; height: 1.25rem;" fill="none" stroke="currentColor"
                        viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
                    </svg>
                    <svg id="moonIcon" style="width: 1.25rem; height: 1.25rem;" fill="none" stroke="currentColor"
                        viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <main class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <h2>Join Your Community</h2>
                <p>Register to report civic issues and keep track of resolutions in your area.</p>
            </div>

            <form id="registerForm" class="auth-form" novalidate>
                <div class="form-row">
                    <div class="form-group">
                        <label for="firstName" class="form-label">First Name</label>
                        <input type="text" id="firstName" name="firstName" class="form-input" placeholder="e.g. Agwom"
                            required>
                        <span class="error-msg" id="firstNameError"></span>
                    </div>

                    <div class="form-group">
                        <label for="lastName" class="form-label">Last Name</label>
                        <input type="text" id="lastName" name="lastName" class="form-input" placeholder="e.g. Gyang"
                            required>
                        <span class="error-msg" id="lastNameError"></span>
                    </div>
                </div>

                <div class="form-group">
                    <label for="email" class="form-label">Email Address</label>
                    <input type="email" id="email" name="email" class="form-input" placeholder="agwom.gyang@example.com"
                        required>
                    <span class="error-msg" id="emailError"></span>
                </div>

                <div class="form-group">
                    <label for="neighborhood" class="form-label">Neighborhood / Area</label>
                    <input type="text" id="neighborhood" name="neighborhood" class="form-input"
                        placeholder="e.g. Jos Central, Rayfield" required>
                    <span class="error-msg" id="neighborhoodError"></span>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" id="password" name="password" class="form-input"
                            placeholder="Min. 8 characters" required>
                        <span class="error-msg" id="passwordError"></span>
                    </div>

                    <div class="form-group">
                        <label for="confirmPassword" class="form-label">Confirm Password</label>
                        <input type="password" id="confirmPassword" name="confirmPassword" class="form-input"
                            placeholder="Re-enter password" required>
                        <span class="error-msg" id="confirmPasswordError"></span>
                    </div>
                </div>

                <div class="form-group checkbox-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="terms" name="terms" required>
                        <span>I agree to the <a href="#" class="auth-link">Terms of Service</a> and <a href="#"
                                class="auth-link">Privacy Policy</a></span>
                    </label>
                    <span class="error-msg" id="termsError"></span>
                </div>

                <button type="submit" class="btn-submit-auth">Create Account</button>
            </form>

            <div class="auth-footer">
                <p>Already have an account? <a href="signin.html" class="auth-link">Log in</a></p>
            </div>
        </div>
    </main>

    <script src="js/signup.js"></script>
</body>

</html>
